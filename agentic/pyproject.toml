[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaoverload-agentic"
version = "0.2.0"
description = "Media generation, review and publishing runtime for MediaOverload."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.1.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "schedule>=1.2.1",
    "websocket-client>=1.7.0",
    "edge-tts==7.2.6",
    "google-api-python-client>=2.126.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "pymysql[rsa]>=1.1.0",
    "discord.py>=2.3.2",
    "tweepy>=4.14.0",
    "cloudinary>=1.36.0",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
agentic = "agentic.app.main:main"
agentic-edit = "agentic.tools.editing_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic.tools" = ["style_picker_web/*.html", "style_picker_web/*.css", "style_picker_web/*.js"]

[tool.ruff.lint]
select = ["E9", "F"]


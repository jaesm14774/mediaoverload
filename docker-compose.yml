services:
  media-scheduler:
    build: .
    volumes:
      # 開發模式：掛載整個專案目錄
      - .:/app
      - ./output:/app/output
      - D:/ComfyUI_windows_portable:/comfyui:ro
    env_file:
      - media_overload.env
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=Asia/Taipei
      # Ollama runs on the Windows host, not inside this scheduler container.
      - OLLAMA_API_BASE_URL=http://host.docker.internal:11434
      # The MySQL container publishes its host port (8787 -> 3306); localhost
      # inside this container would point back to media-scheduler itself.
      - mysql_host=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

name: Agentic CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agentic/pyproject.toml

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version

      - name: Install agentic runtime and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./agentic
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q agentic/src run_media_interface.py

      - name: Run agentic regression suite
        run: python -m pytest agentic/tests -q

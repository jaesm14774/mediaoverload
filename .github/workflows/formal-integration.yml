name: Formal Integration

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-integration:
    if: github.ref == 'refs/heads/main'
    name: Formal Windows GPU / ComfyUI
    runs-on: [self-hosted, windows, x64, mediaoverload-integration]
    environment: mediaoverload-integration
    timeout-minutes: 90
    env:
      AGENTIC_FORMAL_INTEGRATION: "1"
      AGENTIC_NEWS_HISTORY_PATH: ${{ runner.temp }}/mediaoverload-formal/news-selection/kirby.json
      AGENTIC_ALLOWED_IMAGE_ROOTS: ${{ runner.temp }}/mediaoverload-formal
      COMFYUI_HOST: ${{ vars.COMFYUI_HOST || '127.0.0.1' }}
      COMFYUI_PORT: ${{ vars.COMFYUI_PORT || '8188' }}
      COMFYUI_ROOT: ${{ vars.COMFYUI_ROOT || 'D:/ComfyUI_windows_portable' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Load protected formal environment
        shell: pwsh
        env:
          MEDIAOVERLOAD_ENV: ${{ secrets.MEDIAOVERLOAD_ENV }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MEDIAOVERLOAD_ENV)) {
            throw "mediaoverload-integration requires the MEDIAOVERLOAD_ENV environment secret"
          }
          $envPath = Join-Path $env:GITHUB_WORKSPACE "media_overload.env"
          [System.IO.File]::WriteAllText(
            $envPath,
            $env:MEDIAOVERLOAD_ENV,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and test runner
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .\requirements.txt
          python -m pip install -e .\agentic
          python -m pip install pytest

      - name: Verify formal host prerequisites
        shell: pwsh
        run: |
          ffmpeg -version
          if (-not (Test-Path -LiteralPath $env:COMFYUI_ROOT)) {
            throw "COMFYUI_ROOT does not exist: $env:COMFYUI_ROOT"
          }
          $port = [int]$env:COMFYUI_PORT
          $systemStats = Invoke-RestMethod -Uri "http://$($env:COMFYUI_HOST):$port/system_stats" -TimeoutSec 15
          if ($null -eq $systemStats) {
            throw "ComfyUI system_stats returned no payload"
          }

      - name: Run real news-driven integration test
        shell: pwsh
        run: |
          $formalRoot = Join-Path $env:RUNNER_TEMP "mediaoverload-formal"
          New-Item -ItemType Directory -Force -Path $formalRoot | Out-Null
          python -m pytest agentic/tests -m integration -q --junitxml (Join-Path $formalRoot "integration-junit.xml")

      - name: Run canonical production-path smoke
        shell: pwsh
        run: |
          $formalRoot = Join-Path $env:RUNNER_TEMP "mediaoverload-formal"
          $outputRoot = Join-Path $formalRoot "character-workflow"
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          python run_media_interface.py `
            --character kirby `
            --generation-type text2video `
            --news-driven `
            --duration-seconds 5 `
            --stage-probe `
            --dry-run-publish `
            --comfy-host $env:COMFYUI_HOST `
            --comfy-port ([int]$env:COMFYUI_PORT) `
            --comfy-root $env:COMFYUI_ROOT `
            --output-dir $outputRoot

      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediaoverload-formal-integration-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/mediaoverload-formal/**/*.json
            ${{ runner.temp }}/mediaoverload-formal/**/*.log

      - name: Remove protected environment file
        if: always()
        shell: pwsh
        run: |
          $envPath = Join-Path $env:GITHUB_WORKSPACE "media_overload.env"
          if (Test-Path -LiteralPath $envPath) {
            Remove-Item -LiteralPath $envPath -Force
          }

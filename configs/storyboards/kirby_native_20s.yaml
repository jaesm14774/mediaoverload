# Reusable 20-second short-form story contract for both H3 I2V and T2V.
# Plot, world, shots, and audio are generated from the current news item at runtime.

name: kirby_native_h3_short_20s_contract
character: Kirby
native_duration_seconds: 20
native_shot_times:
  - 0-2s
  - 2-6s
  - 6-11s
  - 11-16s
  - 16-20s
render_mode: text_or_image_to_video
story_source: news_llm

story_generation:
  mode: dynamic_news_llm
  plot_generated_at_runtime: true
  format: hook_promise_escalation_reversal_payoff
  required_shot_times:
    - 0-2s
    - 2-6s
    - 6-11s
    - 11-16s
    - 16-20s
  required_beats:
    - hook
    - promise
    - escalation
    - reversal
    - payoff

base_prompt: >-
  Kirby identity contract only: one polished 2D anime Kirby with a round pink
  body, bright red feet, oval blue eyes, tiny arms, and a clear friendly
  silhouette. Use clean cel-shaded shapes, expressive squash-and-stretch motion,
  readable poses, and a hand-painted animated-world palette. Preserve the same
  proportions, palette, and recognizable design throughout the complete clip.
  Do not add a fixed setting, quest, prop, or ending here; those are generated
  from the current news item at runtime.

negative_prompt: >-
  photorealistic, live action, realistic human anatomy, humans, extra characters,
  duplicate Kirby, identity drift, malformed anatomy, readable words, letters,
  numbers, signs, labels, subtitles, logos, watermark, hard cuts, teleporting,
  frozen poses, repeated holding shots, unrelated montage, new quest after payoff

world:
  setting: generated from the selected news item at runtime
  visual_language: >-
    polished 2D anime, cel-shaded animation, hand-painted background, strong
    silhouette, tactile pastel surfaces, generous negative space, one dominant
    prop or environmental force, expressive squash-and-stretch, clear screen
    geography, dynamic camera, readable cause-and-effect, stable Kirby identity
  continuity_rules:
    - Kirby remains the only protagonist and keeps the same identity, proportions, silhouette, and palette in every beat.
    - The resolved story must preserve one stable world geography across all five beats.
    - The same central prop or threat must visibly change state rather than being replaced by unrelated spectacle.
    - The dominant prop or force must visibly cause Kirby's setback, reaction, and payoff; do not add a second gag.
    - When loopable, the final settled image should echo the opening prop or direction while preserving the resolved result.
    - Every beat must change the mission state and hand off a question or consequence to the next beat.
    - The final beat must visibly resolve the original objective without introducing a new quest.

story_spine:
  premise: generated from the selected news item at runtime
  objective: generated from the selected news item at runtime
  obstacle: generated from the selected news item at runtime
  stakes: generated from the selected news item at runtime
  emotional_arc: generated at runtime from surprise through urgent relief
  climax: generated from the selected news item at runtime
  resolution: generated from the selected news item at runtime

native_audio: generated from the resolved story at runtime

# Static contract for the automated native H3 route.
#
# This file is deliberately not a story seed. News selection and all plot,
# setting, props, keyframes, audio, and shot actions are generated at runtime
# by the configured LLM. The values below exist only so the planner and prompt
# validator have a reusable Kirby identity, continuity, and three-act shape.

name: kirby_native_h3_contract
character: Kirby
native_duration_seconds: 15
segment_duration_seconds: 5
default_segment_count: 3
story_source: news_llm

story_generation:
  mode: dynamic_news_llm
  plot_generated_at_runtime: true
  required_shot_times:
    - 0-4s
    - 4-10s
    - 10-15s
  required_beats:
    - hook
    - escalation
    - payoff

# Identity is stable. Narrative content must be supplied by the resolved story.
base_prompt: >-
  Kirby identity contract only: one polished 2D anime Kirby with a round pink
  body, bright red feet, oval blue eyes, tiny arms, and a clear friendly
  silhouette. Preserve the same proportions, palette, and recognizable design
  throughout the complete clip. Do not add a fixed setting, quest, prop, or
  ending here; those are generated from the current news item at runtime.

# These are stable guardrails for callers that inspect the contract before the
# dynamic story is merged. The generated story supplies its final exclusions.
negative_prompt: >-
  humans, extra characters, duplicate Kirby, identity drift, malformed anatomy,
  readable words, letters, numbers, signs, labels, subtitles, logos, watermark,
  hard cuts, teleporting, frozen poses, repeated holding shots

world:
  # Explicit placeholders prevent this contract from being mistaken for a
  # reusable plot. The resolved LLM story replaces these fields before render.
  setting: generated from the selected news item at runtime
  visual_language: >-
    pastel anime, clean shapes, one prop, readable negative space and reaction
  continuity_rules:
    - Kirby remains the only protagonist and keeps the same identity, proportions, silhouette, and palette in every shot.
    - The resolved story must preserve one stable world geography across all three shots.
    - Every shot must visibly change the mission state and hand off to the next beat.
    - The final shot must visibly resolve the original objective without introducing a new quest.

# Structural placeholders only. The native H3 resolver replaces every action,
# title, camera direction, and state change with news-grounded LLM output.
story_spine:
  premise: generated from the selected news item at runtime
  objective: generated from the selected news item at runtime
  obstacle: generated from the selected news item at runtime
  stakes: generated from the selected news item at runtime
  emotional_arc: generated at runtime from alarm through resolved relief
  climax: generated from the selected news item at runtime
  resolution: generated from the selected news item at runtime

native_audio: generated from the resolved story at runtime

native_shots:
  - time: 0-4s
    title: Hook - establish the central problem
    action: Introduce Kirby, the concrete problem, and the first irreversible response.
    camera: Begin with visible motion and establish the stable geography needed for the next beat.
    state_change: Kirby recognizes the problem and commits to one clear objective.
  - time: 4-10s
    title: Escalation - advance under pressure
    action: Kirby actively advances the objective while the central obstacle intensifies.
    camera: Follow continuous action through the same geography without a reset or unrelated cut.
    state_change: The mission becomes harder but the protagonist reaches a new, visibly changed state.
  - time: 10-15s
    title: Payoff - resolve the objective
    action: Kirby performs the decisive action and creates a concrete visible result.
    camera: Follow the decisive action into a stable ending composition that shows the result.
    state_change: The original problem is resolved and the film ends without a new quest.

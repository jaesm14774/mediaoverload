    workflow_descriptions:
      krea2_turbo:
        summary: "本機 RTX 4060 8GB 取向的 Krea 2 Turbo 低 VRAM T2I workflow；以 Q4_0 GGUF、Qwen3-VL 4B 與 Qwen Image VAE 產生 Kirby 首幀或參考圖。"
        strengths:
          - "使用官方 Krea 2 Turbo 的 8-step、Euler、simple、CFG 1 取向，並關閉 prompt enhancer，避免模型自行補入角色外觀描述。"
          - "正面 prompt 由 runtime 的原始需求直接注入；預設 placeholder 只有角色名稱、場景與畫面比例，不暗藏 Kirby 外觀特徵。"
          - "16:9 1024x576 預設與現有 H3 608x352 影片畫面對齊，適合先產生可審核首幀再交給 I2V。"
        tradeoffs:
          - "Krea 2 Turbo 是 T2I，不是原生 T2V；影片仍由 MiniMax H3 I2V 或純 T2V workflow 完成。"
          - "Q4_0 GGUF 是 8GB GPU 的可行起點，會比官方 FP8／BF16 有較明顯的量化取捨；需以本機實際 render 驗證品質。"
      krea2_turbo_img2img:
        summary: "Krea 2 Turbo 低 denoise img2img workflow，用於 Kirby 首幀審核後的 continuity／identity 微調。"
        strengths:
          - "沿用相同 Krea 2 Turbo、Qwen3-VL 4B 與 VAE，提供首幀與修圖階段的低 VRAM 連續性選項；Anima、Nova 與混合 workflow 仍保留作為其他候選。"
          - "預設 8 steps、Euler、simple、CFG 1 與 denoise 0.25，偏向保留輸入構圖，而非重新生成另一個角色。"
        tradeoffs:
          - "這是影像修正階段，不是影片生成；過高 denoise 仍可能改變角色身份或構圖。"
      anima_anime:
        summary: "Anima Preview 2 anime 生圖 workflow，保留作為 Krea2 之外的角色與貼圖候選。"
        strengths:
          - "偏乾淨線條、角色表情與簡潔二次元構圖。"
        tradeoffs:
          - "需要本機 Anima 資產；未安裝時 runtime 會在資產檢查階段拒絕執行。"
      nova-anime-xl:
        summary: "Nova SDXL anime workflow，適合高完成度角色圖、完整背景與主視覺。"
        strengths:
          - "偏精緻角色、場景敘事與封面級構圖。"
        tradeoffs:
          - "需要本機 Nova/SDXL 資產，速度與顯存需求高於 Krea2 Q4。"
      z_image_plus_nova_model:
        summary: "Z-Image Turbo 先構圖、Nova SDXL 後細化的混合 workflow；保留為明確的混合候選，不是純 Z-Image 路線。"
        strengths:
          - "適合快速探索後再做 reference-attention 細化。"
        tradeoffs:
          - "兩階段圖像流程較吃資源，且需要 Z-Image 與 Nova 資產。"
      nova_model_plus_z_image_anime:
        summary: "Nova 與 Z-Image Anime 混合 workflow，保留作為 hybrid anime refine/key visual 候選。"
        strengths:
          - "可用於受控重繪、快速 key visual 迭代與身份保留。"
        tradeoffs:
          - "需要完整 Nova 與 Z-Image Anime 資產；不等同於純 Z-Image workflow。"
      kirby_keyframe_anima:
        summary: "Kirby 專用 Anima keyframe workflow，保留作為角色故事開場候選。"
        strengths:
          - "直接產生 landscape keyframe，可接 H3 I2V。"
        tradeoffs:
          - "需要 Anima 資產，Krea2 是目前已完成本機 live 驗證的首選。"
      image_to_image:
        summary: "通用 img2img refine workflow，保留給需要明顯構圖與細節重繪的需求。"
        strengths:
          - "可保留輸入構圖並做中度風格與細節修正。"
        tradeoffs:
          - "不是 Krea2 identity continuity 的低 denoise 預設。"
      kirby_continuity_img2img:
        summary: "Kirby 低 denoise continuity workflow，保留前一幀身份與構圖。"
        strengths:
          - "適合故事段落間的連續性修正。"
        tradeoffs:
          - "需要 Anima 資產，Krea2 img2img 是本機已驗證替代方案。"
      kirby_identity_img2img:
        summary: "Kirby identity refine workflow，保留作為較強角色修正候選。"
        strengths:
          - "比 continuity 路線允許更多身份細節重繪。"
        tradeoffs:
          - "需要 Anima 資產，較高 denoise 可能改變原始構圖。"
      minimax_h3_lowvram_15s_fl2va_i2v:
        summary: "MiniMax H3 低 VRAM 15 秒影像條件 workflow；同一個 ImageToVideo node 可依輸入綁定 first frame、last frame 或兩者。"
        strengths:
          - "graph 明確包含 optional `first_frame` 與 `last_frame`，因此可承載 I2VA、FL2VA 與 L2VA 三種契約。"
          - "使用 Q4 GGUF、system-RAM Spectrum accelerator 與 H3 audio VAE，適合目前的 balanced-lowvram profile。"
          - "輸出 CreateVideo 並合成原生 stereo audio。"
        tradeoffs:
          - "它不是純 T2V；至少需要由上游產生或審核可用的 frame condition。"
          - "15 秒與低 VRAM 設定是固定取向，長篇內容應改用 text2longvideo。"
      minimax_h3_native_t2v:
        summary: "MiniMax H3 官方 INT8 native T2V fallback workflow，以 prompt 直接生成影片與原生音訊。"
        strengths:
          - "graph 的 MiniMaxH3ImageToVideo node 沒有 first_frame 或 last_frame input，契約是純 prompt T2V。"
          - "使用官方 INT8 diffusion、NVFP4 text encoder 與 H3 video/audio VAE。"
        tradeoffs:
          - "沒有畫面條件輸入，不能保證既有角色圖的身份或構圖延續；低 VRAM profile 優先使用 minimax_h3_lowvram_t2v。"
      minimax_h3_ref2va:
        summary: "MiniMax H3 Reference-to-Video workflow，runtime 綁定多張圖片與可選參考影片，不接受 reference audio。"
        strengths:
          - "graph 使用 `MiniMaxH3ReferenceToVideo` node，reference slots 在 runtime 由已驗證 manifest 動態注入。"
          - "適合需要共同保留角色身份、風格、場景、道具或 motion/camera 語言的多素材需求。"
          - "輸出原生 H3 video 與 generated stereo audio，reference audio 被明確排除。"
        tradeoffs:
          - "已配置但缺檔或不可讀的 image/video manifest 會被拒絕；空 manifest 則可走六張候選圖加 Discord 選擇 gate。單一首圖需求應改用一般 I2V。"
          - "reference 約束越多，prompt 與素材角色標註越重要，也會增加 runtime 資源壓力。"
      minimax_h3_lowvram_t2v:
        summary: "MiniMax H3 原生 text-to-video workflow，適合純 prompt 驅動的連續短片，並保留 H3 原生音訊輸出。"
        strengths:
          - "適合探索新的場景、動作與鏡頭，不需要先準備輸入圖片。"
          - "H3 原生 audio VAE 會依 prompt 產生聲音，適合有環境聲或效果音的短片。"
          - "適合 text2video 與沒有既有首幀約束的單一連續故事。"
        tradeoffs:
          - "若角色外觀或開場構圖必須延續既有圖片，應改選 `minimax_h3_lowvram_i2v`。"
      minimax_h3_lowvram_i2v:
        summary: "MiniMax H3 原生 image-to-video workflow，適合把已定稿圖片轉成帶原生音訊的短影片。"
        strengths:
          - "以輸入圖片鎖定角色身份與開場構圖，再生成連續動作、鏡頭運動與聲音。"
          - "適合 text2image2video、text2longvideo 與動態貼圖的片段動畫核心。"
          - "balanced-lowvram profile 使用 608x352、24 fps 與 system-RAM offload。"
        tradeoffs:
          - "需要先有可讀取的輸入圖片與 H3 模型資產，VRAM／system RAM 壓力高於一般生圖。"
          - "若沒有既有畫面控制需求，純 prompt 的 `minimax_h3_lowvram_t2v` 更直接。"
      Tile Upscaler SDXL:
        summary: "最終放大與細節回填 workflow，適合交付前提升解析度、紋理細節與局部清晰度。"
        strengths:
          - "manifest 顯示依賴 SDXL checkpoint、lightning lora 與 tile controlnet，定位是交付前 quality lift。"
          - "適合 higher resolution、detail enhancement、final upscale。"
        tradeoffs:
          - "這不是重做構圖的 workflow，應放在成品後段而不是創作前段。"
    count_guidance:
      text2img:
        image_count_rule: "單張主視覺預設 1；若需求包含 variants、options、AB test、挑圖，可提高到 2-4。"
      text2video:
        image_count_rule: "若需要先做 ideation 或 cover review 可產生 2-4 張；這些圖片不會成為 T2V 的 conditioning。"
        video_count_rule: "單一需求預設 1；只有要不同 motion 版本時再增加到 2-4。"
      text2image2video:
        image_count_rule: "建議先用 1-3 張首圖做篩選，再從最佳首圖延伸影片。"
        video_count_rule: "通常 1 支影片就夠；只有要多種動作版本時才增加。"
      text2image2native_h3_ref2va:
        image_count_rule: "先產生六張 reference candidates；這些是等待使用者挑選的參考素材，不是未經選擇的首幀 conditioning。"
        review_selection_limit_rule: "Discord 正常流程選 1-4 張；Reject 時停止，不自動替換或補選。"
        video_count_rule: "候選 reference 通過選擇後，預設只生成 1 支 native H3 Ref2VA 影片。"
      text2longvideo:
        segment_count_rule: "只有需求具備多段敘事時才提高 segment_count；2-4 適合短故事，5-8 適合明確分章節內容。"
      text2image2image:
        image_count_rule: "通常 1-2 張 refine 結果已足夠；只有要比對不同修圖方向時才拉到 3-4。"
      sticker_pack:

  routing_hints:
    strategy_preferences:
      sticker_pack:
        - sticker
        - sticker pack
        - reaction
        - emotions
        - line sticker
        - messenger sticker
        - emoji pack
        - expression sheet
        - chat reaction
      text2longvideo:

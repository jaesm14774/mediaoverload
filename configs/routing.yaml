    workflow_descriptions:
      anima_anime:
        summary: "Anima Preview 2 路線的 anime 生圖 workflow，內建 anime upscaling，偏乾淨線條、角色表情與純二次元視覺。"
        strengths:
          - "workflow 使用可用的 `anima-aesthetic-v1.1`、`qwen_image_vae` 與 `qwen_3_06b_base`，適合 anime 角色主體明確的出圖。"
          - "相對適合 line sticker、角色立繪、Q 版或簡潔背景場景。"
          - "推薦預設有固定 steps 與 cfg，適合穩定產生角色母圖。"
        tradeoffs:
          - "對超複雜背景、厚塗質感、封面級大場景不一定比 SDXL 類 anime checkpoint 強。"
      nova-anime-xl:
        summary: "以 SDXL anime checkpoint 為主的高完成度插畫 workflow，適合精緻角色圖、背景完整的場景圖與主視覺。"
        strengths:
          - "manifest 顯示依賴 `novaAnimeXL_ilV140`、`reiXL_NB11`、`waiIllustriousSDXL_v150`，偏向高完成度角色與插畫感。"
          - "更適合 detailed illustration、奇幻場景、封面圖、主視覺與背景敘事。"
          - "當需求提到高細節、精緻背景、2.5D anime 時可優先考慮。"
        tradeoffs:
          - "若目標是快速多輪試稿，速度通常不如 turbo 類流程。"
      nova_model_plus_z_image_anime:
        summary: "結合 Nova 與 Z-Image Turbo Anime 的快速 anime workflow，偏 8-step、快速試稿、多候選探索與 prompt 迭代。"
        strengths:
          - "manifest 顯示依賴 `zImageTurboAnime_aioBF16` 與 8-step control 類資產，定位偏快而不是極限精修。"
          - "適合先看方向、做多張候選、快速 A/B 測試。"
          - "較適合拿來做第一輪 key visual 或影片首幀探索。"
        tradeoffs:
          - "若要單張最終成品感與高細節堆疊，常常仍會輸給 nova-anime-xl。"
      z_image_plus_nova_model:
        summary: "先用 Z Image Turbo 生成構圖，再以 SDXL reference-attention 路線做二階段細化的混合 workflow。"
        strengths:
          - "graph 同時包含 `z_image_turbo_bf16`、Qwen 3 文字編碼與 SDXL `waiIllustriousSDXL_v150`。"
          - "第二階段使用 reference preprocessor、reference ControlNet 與 SDXL sampler，適合快速探索後再穩定構圖。"
          - "適合 text2img 的動態構圖與需要多候選的 anime 初稿。"
        tradeoffs:
          - "這是兩階段靜態圖 workflow，不是 video workflow；reference image 只屬於此圖像細化階段。"
          - "比單一 turbo 出圖更吃顯存與執行時間。"
      kirby_keyframe_anima:
        summary: "Kirby 專用 Anima 直接生圖 keyframe workflow，用於 native H3 故事的開場候選與人工審核。"
        strengths:
          - "graph 直接載入 Anima Preview 2、Qwen 文字編碼與 Qwen image VAE，輸出單張 landscape keyframe。"
          - "適合先固定 Kirby 身份、服裝、構圖與故事開場，再交給 H3 I2VA。"
          - "SaveImage 輸出可作為 immutable first frame 的上游素材。"
        tradeoffs:
          - "它只產生圖片，不會產生影片，也不會鎖定 H3 的最後一幀。"
      kirby_continuity_img2img:
        summary: "Kirby 連續性低 denoise img2img workflow，讀取上一張 frame 並做輕量身份與畫面延續修正。"
        strengths:
          - "graph 讀取前一張 Kirby frame、以 VAEEncode 進入 latent，並使用 Anima denoise 0.18。"
          - "適合故事段落間的 continuity refine，不應被當成全新構圖生成。"
        tradeoffs:
          - "低 denoise 會保留較多原圖；若需要較強重繪，改用 kirby_identity_img2img。"
      kirby_identity_img2img:
        summary: "Kirby 身份一致性 img2img workflow，讀取既有 frame 並以較高 denoise 做角色外觀修正。"
        strengths:
          - "graph 讀取前一張 frame、使用同一套 Anima 模型，denoise 0.35 比 continuity 路線更能修正身份細節。"
          - "適合角色辨識度、臉部、服裝或局部一致性需要加強的 keyframe refine。"
        tradeoffs:
          - "比 kirby_continuity_img2img 允許更多重繪，可能改變原始構圖或細節。"
      minimax_h3_lowvram_15s_fl2va_i2v:
        summary: "MiniMax H3 低 VRAM 15 秒影像條件 workflow；同一個 ImageToVideo node 可依輸入綁定 first frame、last frame 或兩者。"
        strengths:
          - "graph 明確包含 optional `first_frame` 與 `last_frame`，因此可承載 I2VA、FL2VA 與 L2VA 三種契約。"
          - "使用 Q4 GGUF、system-RAM Spectrum accelerator 與 H3 audio VAE，適合目前的 balanced-lowvram profile。"
          - "輸出 CreateVideo 並合成原生 stereo audio。"
        tradeoffs:
          - "它不是純 T2V；至少需要由上游產生或審核可用的 frame condition。"
          - "15 秒與低 VRAM 設定是固定取向，長篇內容應改用 text2longvideo。"
      minimax_h3_native_t2v:
        summary: "MiniMax H3 官方 INT8 native T2V fallback workflow，以 prompt 直接生成影片與原生音訊。"
        strengths:
          - "graph 的 MiniMaxH3ImageToVideo node 沒有 first_frame 或 last_frame input，契約是純 prompt T2V。"
          - "使用官方 INT8 diffusion、NVFP4 text encoder 與 H3 video/audio VAE。"
        tradeoffs:
          - "沒有畫面條件輸入，不能保證既有角色圖的身份或構圖延續；低 VRAM profile 優先使用 minimax_h3_lowvram_t2v。"
      minimax_h3_native_i2v:
        summary: "MiniMax H3 官方 INT8 image-to-video fallback workflow，使用單一 first frame 產生影片與原生音訊。"
        strengths:
          - "graph 的 MiniMaxH3ImageToVideo node 明確有 optional `first_frame` input，適合一般 I2V。"
          - "使用官方 INT8 diffusion、NVFP4 text encoder 與 H3 video/audio VAE。"
        tradeoffs:
          - "只支援 first-frame conditioning；需要 first+last 或只鎖 last frame 時，改用低 VRAM FL2VA-compatible graph。"
      minimax_h3_ref2va:
        summary: "MiniMax H3 Reference-to-Video workflow，runtime 綁定多張圖片與可選參考影片，不接受 reference audio。"
        strengths:
          - "graph 使用 `MiniMaxH3ReferenceToVideo` node，reference slots 在 runtime 由已驗證 manifest 動態注入。"
          - "適合需要共同保留角色身份、風格、場景、道具或 motion/camera 語言的多素材需求。"
          - "輸出原生 H3 video 與 generated stereo audio，reference audio 被明確排除。"
        tradeoffs:
          - "沒有非空且可讀取的 image/video manifest 時不可自動選用；單一首圖需求應改用一般 I2V。"
          - "reference 約束越多，prompt 與素材角色標註越重要，也會增加 runtime 資源壓力。"
      minimax_h3_lowvram_t2v:
        summary: "MiniMax H3 原生 text-to-video workflow，適合純 prompt 驅動的連續短片，並保留 H3 原生音訊輸出。"
        strengths:
          - "適合探索新的場景、動作與鏡頭，不需要先準備輸入圖片。"
          - "H3 原生 audio VAE 會依 prompt 產生聲音，適合有環境聲或效果音的短片。"
          - "適合 text2video 與沒有既有首幀約束的單一連續故事。"
        tradeoffs:
          - "若角色外觀或開場構圖必須延續既有圖片，應改選 `minimax_h3_lowvram_i2v`。"
      minimax_h3_lowvram_i2v:
        summary: "MiniMax H3 原生 image-to-video workflow，適合把已定稿圖片轉成帶原生音訊的短影片。"
        strengths:
          - "以輸入圖片鎖定角色身份與開場構圖，再生成連續動作、鏡頭運動與聲音。"
          - "適合 text2image2video、text2longvideo 與動態貼圖的片段動畫核心。"
          - "balanced-lowvram profile 使用 608x352、24 fps 與 system-RAM offload。"
        tradeoffs:
          - "需要先有可讀取的輸入圖片與 H3 模型資產，VRAM／system RAM 壓力高於一般生圖。"
          - "若沒有既有畫面控制需求，純 prompt 的 `minimax_h3_lowvram_t2v` 更直接。"
      image_to_image:
        summary: "通用 img2img refine workflow，適合保留原圖構圖與主體後，做較明顯的風格重繪與細節修正。"
        strengths:
          - "manifest 推薦 `denoise: 0.7`，代表不是只做輕微修飾，而是允許中度改寫。"
          - "適合修手、修臉、補背景、統一畫風或做 transition frame。"
        tradeoffs:
          - "若需求強調 anime identity 延續，通常不如 `z_image_i2i_anime` 對口。"
      z_image_i2i_anime:
        summary: "anime 向 img2img refine workflow，適合維持 anime 語彙、角色 identity 與色彩一致性。"
        strengths:
          - "manifest 直接綁定 `zImageTurboAnime_aioBF16`，更偏 anime 角色修圖。"
          - "適合 anime 化重繪、角色一致化、表情修正與局部 cleanup。"
        tradeoffs:
          - "若要跨風格或偏寫實重構，泛用 `image_to_image` 可能更彈性。"
      Tile Upscaler SDXL:
        summary: "最終放大與細節回填 workflow，適合交付前提升解析度、紋理細節與局部清晰度。"
        strengths:
          - "manifest 顯示依賴 SDXL checkpoint、lightning lora 與 tile controlnet，定位是交付前 quality lift。"
          - "適合 higher resolution、detail enhancement、final upscale。"
        tradeoffs:
          - "這不是重做構圖的 workflow，應放在成品後段而不是創作前段。"
    count_guidance:
      text2img:
        image_count_rule: "單張主視覺預設 1；若需求包含 variants、options、AB test、挑圖，可提高到 2-4。"
      text2video:
        image_count_rule: "若需要先做 ideation 或 cover review 可產生 2-4 張；這些圖片不會成為 T2V 的 conditioning。"
        video_count_rule: "單一需求預設 1；只有要不同 motion 版本時再增加到 2-4。"
      text2image2video:
        image_count_rule: "建議先用 1-3 張首圖做篩選，再從最佳首圖延伸影片。"
        video_count_rule: "通常 1 支影片就夠；只有要多種動作版本時才增加。"
      text2image2native_h3_ref2va:
        image_count_rule: "先產生 4-6 張 reference candidates；這些是等待使用者挑選的參考素材，不是未經選擇的首幀 conditioning。"
        review_selection_limit_rule: "Discord 正常流程選 1-4 張；Reject 時停止，不自動替換或補選。"
        video_count_rule: "候選 reference 通過選擇後，預設只生成 1 支 native H3 Ref2VA 影片。"
      text2longvideo:
        segment_count_rule: "只有需求具備多段敘事時才提高 segment_count；2-4 適合短故事，5-8 適合明確分章節內容。"
      text2image2image:
        image_count_rule: "通常 1-2 張 refine 結果已足夠；只有要比對不同修圖方向時才拉到 3-4。"
      sticker_pack:
        sticker_expression_count_rule: "基本貼圖組可用 4-6 個表情；完整聊天貼圖組可用 8-12。"
        images_per_prompt_rule: "每個表情 1 張適合高一致性；若想為同表情挑版本，可提高到 2-4。"

routing:
  enabled: true
  strategy_candidates:
    - text2img
    # Disabled because current output quality is not acceptable. This route
    # remains available only when explicitly requested with --generation-type.
    # - text2video
    - text2image2video
    - text2longvideo
    - native_h3_story
    - native_h3_t2v_story
    - native_h3_fl2va_story
    - native_h3_l2va_story
    - native_h3_ref2va
    - text2image2native_h3_ref2va
    # Disabled because current output quality is not acceptable. This is the
    # canonical name for the text2img2img strategy.
    # - text2image2image
    - sticker_pack

  # Image-conditioned routes use a human-reviewed image gate before video
  # render. Pure T2V routes remain prompt-only. Ref2VA may bind several
  # approved references; first-frame routes bind one approved frame.
  pre_video_review:
    enabled: true
    candidate_count: 6
    default_selection_limit: 1
    ref2va_selection_limit: 4
    reject_stops_workflow: true
    # A Discord transport/timeout failure should not erase a valid keyframe
    # run. Explicit human Reject remains a hard stop.
    failure_policy: fallback_to_top

  longvideo_config:
    production_profile: text2longvideo
    default_duration_seconds: 30
    segment_duration: 5
    storyboard_path: configs/storyboards/text2longvideo_story.yaml
    review_policy: opening_only
    continuity_mode: rendered_tail
    workflow_names:
      - minimax_h3_lowvram_i2v
      - minimax_h3_lowvram_15s_fl2va_i2v
    width: 608
    height: 352
    length: 120
    steps: 16
    model_profile: q2

  # Scheduler runs use a persisted shuffle bag so a short run window cannot
  # accidentally repeat the same strategy while still respecting weights.
  route_diversity:
    enabled: true
    history_window: 24

  # These are applied only after workflow JSON candidates are resolved and
  # locally available required assets are checked.  Keep Krea available, but
  # do not make it the implicit first-choice winner for every image stage.
  workflow_selection_weights:
    image_workflow_name:
      krea2_turbo: 3
      anima_anime: 2
      nova-anime-xl: 2
      z_image_plus_nova_model: 1
      nova_model_plus_z_image_anime: 1
      kirby_keyframe_anima: 1
    refine_workflow_name:
      krea2_turbo_img2img: 3
      image_to_image: 2
      kirby_continuity_img2img: 1
      kirby_identity_img2img: 1
    transition_workflow_name:
      krea2_turbo_img2img: 3
      image_to_image: 2
      kirby_continuity_img2img: 1
      kirby_identity_img2img: 1
    video_workflow_name:
      minimax_h3_lowvram_i2v: 3
      minimax_h3_lowvram_t2v: 3
      minimax_h3_lowvram_15s_fl2va_i2v: 3
      minimax_h3_ref2va: 2
      minimax_h3_native_t2v: 1


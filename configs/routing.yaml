        - z_image_plus_nova_model
        - nova_model_plus_z_image_anime
        - kirby_keyframe_anima
      video_workflow_name:
        - minimax_h3_i2va
    # Additive game asset route. Its stage contract is separate from the
    # existing strategies while the route remains available to selection.
    game_sprite:
      image_workflow_name:
        - krea2_turbo
      video_workflow_name:
        - minimax_h3_i2va


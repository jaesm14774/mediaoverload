routing:
  enabled: true
  strategy_candidates:
    - text2img
    # Disabled because current output quality is not acceptable. This route
    # remains available only when explicitly requested with --generation-type.
    # - text2video
    - text2image2video
    - serial_video
    - native_h3_story
    - native_h3_t2v_story
    - native_h3_fl2va_story
    - native_h3_loop_story
    - native_h3_l2va_story
    - native_h3_ref2va
    - text2image2native_h3_ref2va
    # Disabled because current output quality is not acceptable. This is the
    # canonical name for the text2img2img strategy.
    # - text2image2image
    - sticker_pack
    - story_card
    - motion_comic
    - series_carousel
    - game_sprite

  # Image-conditioned routes use a human-reviewed image gate before video
  # render. Pure T2V routes remain prompt-only. Ref2VA may bind several
  # approved references; first-frame routes bind one approved frame.
  pre_video_review:
    enabled: true
    candidate_count: 6
    default_selection_limit: 1
    ref2va_selection_limit: 4
    reject_stops_workflow: true
    # A Discord transport/timeout failure should not erase a valid keyframe
    # run. Explicit human Reject remains a hard stop.
    failure_policy: fallback_to_top

  # These are applied only after workflow JSON candidates are resolved and
  # locally available required assets are checked.  Keep Krea available, but
  # do not make it the implicit first-choice winner for every image stage.
  workflow_selection_weights:
    image_workflow_name:
      krea2_turbo: 3
      anima_anime: 2
      nova-anime-xl: 2
      z_image_plus_nova_model: 1
      nova_model_plus_z_image_anime: 1
      kirby_keyframe_anima: 1
    refine_workflow_name:
      flux3_image_klein_img2img: 3
    video_workflow_name:
      minimax_h3_i2va: 3
      minimax_h3_t2va: 3
      minimax_h3_fl2va: 3
      minimax_h3_ref2va: 2

  strategy_contexts:
    game_sprite:
      reference_pack_version: game_sprite_action_references_v1
      visual_contract: >-
        Crisp 2D pixel-art game asset: hard pixel clusters, a limited readable
        palette, clean silhouette edges, deliberate pose exaggeration, and
        nearest-neighbor-friendly shapes; never painterly, photoreal, tabletop,
        soft 3D, or cinematic concept art.

  workflow_stage_candidates:
    motion_comic:
      image_workflow_name:
        - krea2_turbo
    # Writing-first route. Kirby's character YAML gives it an explicit
    # generation_type_weights entry so bare CLI runs can select it.
    story_card:
      image_workflow_name:
        - krea2_turbo
    series_carousel:
      image_workflow_name:
        - krea2_turbo
    text2img:
      image_workflow_name:
        - krea2_turbo
        - anima_anime
        - nova-anime-xl
        - z_image_plus_nova_model
        - nova_model_plus_z_image_anime
        - kirby_keyframe_anima
    text2video:
      image_workflow_name:
        - krea2_turbo
        - anima_anime
        - nova-anime-xl
        - z_image_plus_nova_model
        - nova_model_plus_z_image_anime
        - kirby_keyframe_anima
      video_workflow_name:
        - minimax_h3_t2va
    text2image2video:
      image_workflow_name:
        - krea2_turbo
      video_workflow_name:
        - minimax_h3_i2va
      upscale_workflow_name:
        - Tile Upscaler SDXL
    native_h3_story:
      image_workflow_name:
        - krea2_turbo
      video_workflow_name:
        - minimax_h3_i2va
    native_h3_t2v_story:
      video_workflow_name:
        - minimax_h3_t2va
    native_h3_fl2va_story:
      image_workflow_name:
        - krea2_turbo
      video_workflow_name:
        - minimax_h3_fl2va
      refine_workflow_name:
        - flux3_image_klein_img2img
    native_h3_loop_story:
      image_workflow_name:
        - krea2_turbo
      video_workflow_name:
        - minimax_h3_fl2va
    native_h3_l2va_story:
      image_workflow_name:
        - krea2_turbo
      video_workflow_name:
        - minimax_h3_l2va
      refine_workflow_name:
        - flux3_image_klein_img2img
    native_h3_ref2va:
      video_workflow_name:
        - minimax_h3_ref2va
    text2image2native_h3_ref2va:
      image_workflow_name:
        - krea2_turbo
      video_workflow_name:
        - minimax_h3_ref2va
    text2image2image:
      image_workflow_name:
        - krea2_turbo
      refine_workflow_name:
        - flux3_image_klein_img2img
    sticker_pack:

  routing_hints:
    runtime_context_schema:
      reference_manifest_available: "Runtime boolean. True only when at least one configured image/video reference exists and every configured file is readable."
      reference_image_count: "Runtime count of validated reference images; paths are intentionally not sent to the LLM."
      reference_video_count: "Runtime count of validated reference videos; paths are intentionally not sent to the LLM."
      automatic_ref2va_eligible: "Runtime boolean. True when configured references are valid or when the automatic route can create six T2I candidates for Discord reference selection."
      reference_manifest_error_code: "Runtime status: auto_generation_available, missing_file, invalid, or empty string when validated."
      routing_policy: "native_h3_ref2va uses existing references when available; with an empty manifest it expands into the same six-candidate Discord review contract as text2image2native_h3_ref2va."
    workflow_stage_contracts:
      motion_comic:
        image_workflow_name: "Required text-to-image stage: one illustration for each of three LLM-authored causal beats. Exact captions and progressive-panel timing are composed by Pillow/FFmpeg; no neural video workflow or prewritten story file is required."
      story_card:
        image_workflow_name: "Required text-to-image stage that renders one small vignette per page of the resolved selected character beside that page's own object or action; Pillow dissolves each into cream paper and sets the exact text."
      series_carousel:
        image_workflow_name: "Required text-to-image stage that renders one page per cast member from one fixed scene with a single seed; only the character differs between pages, so the pages read as one set."
      text2img:
        image_workflow_name: "Required static-image stage. It may produce one image or the configured candidate count; no video stage is implied."
      text2video:
        image_workflow_name: "Optional ideation/cover artifact only; it is not connected as video conditioning."
        video_workflow_name: "Required T2V stage. Select only a workflow whose graph has no first_frame or last_frame input."
      text2image2video:
        image_workflow_name: "Krea2 generates the opening-frame candidates; the selected image becomes H3 I2VA's first-frame input."
        video_workflow_name: "Required I2V stage. It must accept first_frame conditioning."
      text2image2image:
        image_workflow_name: "Krea2 creates the source image for the reference edit."
        refine_workflow_name: "FLUX Klein edits the Krea2 source with the requested change while using it as visual identity and composition reference."
      serial_video:
        video_workflow_name: "Weighted selection dispatches to the serial application flow, which owns episode ideas, continuity, review, and publication."
      native_h3_story:
        image_workflow_name: "Krea2 generates the opening keyframe candidates; review selects one first frame for H3 I2VA."
        video_workflow_name: "Native H3 I2VA stage. It receives first_frame and leaves the ending unconstrained."
      native_h3_t2v_story:
        video_workflow_name: "Required Native H3 T2V stage. It is prompt-only and must not receive first_frame, last_frame, or reference-manifest conditioning."
      native_h3_fl2va_story:
        image_workflow_name: "Krea2 creates the opening image; FLUX uses that selected image to produce a distinct landing state."
        video_workflow_name: "Native H3 FL2VA stage. It receives both first_frame and last_frame."
        refine_workflow_name: "FLUX Klein reference edit that preserves the selected opening identity while applying the ending prompt."
      native_h3_loop_story:
        image_workflow_name: "Krea2 creates the opening keyframe candidates; the one frame chosen in review is bound as both first_frame and last_frame, so no second ending image is made."
        video_workflow_name: "Native H3 FL2VA stage. It receives the same approved image as first_frame and last_frame, so the clip ends where it began."
      native_h3_l2va_story:
        image_workflow_name: "Krea2 creates an identity source; FLUX edits it into the reviewed landing keyframe."
        video_workflow_name: "Native H3 L2VA stage. It receives last_frame and leaves the opening unconstrained."
        refine_workflow_name: "FLUX Klein reference edit from the Krea2 identity source into the requested final story state."
      native_h3_ref2va:
        video_workflow_name: "Reference-to-video stage. Existing reference images/videos are used directly; with no manifest, runtime first creates six T2I candidates and injects only Discord-selected references. Reference audio is forbidden."
      text2image2native_h3_ref2va:
        image_workflow_name: "Krea2 generates six T2I reference candidates from the native story prompt; these are reviewable references, not an implicit first frame."
        video_workflow_name: "Required native H3 Ref2VA stage. It receives only the references explicitly selected by the user in Discord; reference audio is forbidden."
      sticker_pack:
        image_workflow_name: "Required batch image stage. Generate the configured expression candidates with transparent-background and sticker-safe composition rules. The sticker_pack planner ends after packaging; any optional video candidate belongs to the separate explicit animated_sticker route."
      game_sprite:
        image_workflow_name: "Required Krea source-image stage for one generated game subject; the output is a single subject on a sprite-safe background, not a storyboard or action sheet."
        video_workflow_name: "Required H3 I2V stage for one continuous generated motion; the clip is sampled into a fixed 4x4 atlas after rendering."
    strategy_preferences:
      serial_video:
        - episodic series
        - recurring episodes
        - serial video
        - story
        - episode
        - narration
        - long video
        - multi scene
        - storyboard
        - sequence
        - plot beat
      sticker_pack:
        - sticker
        - sticker pack
        - reaction
        - emotions
        - line sticker
        - messenger sticker
        - emoji pack
        - expression sheet
        - chat reaction
      native_h3_story:
        - native H3
        - one continuous story clip
        - causal short film
        - fifteen second story
        - single take animation
      text2image2native_h3_ref2va:
        - reference candidates
        - choose reference images
        - multiple reference images
        - generate references then animate
        - multi-reference video
        - reference-to-video from generated images
      native_h3_t2v_story:
        - native H3 text to video story
        - direct text to video
        - fifteen second animation
        - no reference image
        - animated short film
      text2image2video:
        - short clip
        - short video
        - animated shot
        - turn still image into video
        - key visual with motion
        - cinematic reveal
      text2video:
        - motion
        - animated
        - moving scene
        - camera movement
        - looping motion
        - dynamic shot
    strategy_descriptions:
      serial_video:
        summary: "Persistent story-first video series with planned episodes, reviewed visual continuity, and publication approval."
        best_for:
          - "A long story with chapters, scenes, narration, or recurring episodes that needs planned continuity."
        avoid_when:
          - "A single short action that fits one clip."
        hard_rules:
          - "Use serial story and episode planning, accepted assets for continuity, per-segment review, and publication approval."
          - "Do not add episode numbers or topic headings to public captions."
      motion_comic:
        summary: "LLM 自動規劃三格因果故事，以同一角色和場景生成三張插畫，逐格揭示並保留前格，精確繁中配字後合成直式短片；預設九秒。"
        best_for:
          - "角色日常、可見狀態變化、承諾落空或其他有明確收尾的社群漫畫。"
        avoid_when:
          - "需要連續肢體動作、原生聲音或真實事件的連續影片重現。"
        hard_rules:
          - "故事由本輪主題與 resolved subject 交給 LLM 規劃，不使用固定故事或角色 fallback。"
          - "三格必須有 setup、escalation、payoff，每句文字對應可見事件，結尾回應標題。"
          - "每格圖片不生成文字；字幕由合成器精確加入。維持角色、道具設計、場景和鏡頭一致。"
          - "最終圖文一致性仍由既有審查確認；技術 QA 不等於故事通過。"
      series_carousel:
        summary: "固定模板系列輪播：LLM 只寫一次場景（鏡頭、道具位置、角色位置與大小都寫死，角色處留一個 {character} 空格），同一個種子畫出同一個群組的多位角色，每頁只有角色不同，看起來就是一整套。不產生影片。"
        best_for:
          - "想用同一個可愛場景展示群組裡多位角色的系列貼文，例如同一張床、同一面鏡子換角色。"
        avoid_when:
          - "需求是單一角色的情緒或姿勢變化；改用 text2img 或 sticker_pack。"
          - "需求是影片、文字閱讀或有劇情的多格故事；改用影片策略、story_card 或 motion_comic。"
        hard_rules:
          - "場景模板只能有一個 {character}，不得寫出任何成員名字；每位成員只換名字和一句不超過十二個字的外觀。"
          - "每頁使用同一個種子與同一段提示，除角色外不得有差異；LLM 不可用時直接失敗，不使用寫死的場景。"
          - "成員必須來自設定角色所屬的群組，第一頁是當輪主角；群組成員數少於頁數時直接失敗。"
      story_card:
        summary: "寫作優先的繁中故事字卡：新聞只是門，第一頁放入來源細節，中段用一個日常比方說出關於人的真道理並反轉讀者對細節的理解，最後一頁回扣同一個細節。頁數隨來源證據而定（只有標題 1–3 頁，有摘要 3–5 頁，有正文 4–7 頁），多頁時每頁 50–120 字、目標 60–100 字，是寫滿的一個小步驟。字卡使用自己的 4:5 直式畫布，不借用整輪隨機抽到的畫布。米色紙上每頁各有一幅當輪角色的淡出小插畫（畫的是該頁文字裡的那件物件，物件與構圖逐頁不同），文字由 Pillow 精確排版，不產生影片。"
        best_for:
          - "需求重點是安靜、細膩、讓人讀完後重新理解一件事的文字。"
          - "新聞細節必須參與文章：第一頁放入，中段用比方翻轉讀者的理解，最後一頁回扣；整篇不能只是複述新聞。"
          - "需要可愛的角色小插畫，但不能搶走文字注意力。"
        avoid_when:
          - "需求是影片、鏡頭運動、旁白或需要動態節奏；改用影片策略。"
          - "需求是單張主視覺或貼圖批次；改用 text2img 或 sticker_pack。"
        hard_rules:
          - "插畫不得含可讀文字、logo 或 watermark；每頁只畫一個角色與一個來自該頁文字的小物件（圖要對得上字，不出現第二隻生物），各頁物件與構圖不同，四周留白由 Pillow 淡出。"
          - "主角必須是當輪 resolved selected character；不可寫死 Kirby、不可在角色解析失敗時 fallback。"
          - "新聞事實只用來源明載的；不寫當事人的感受、動機或真誠與否，不替任何人背書或批評。比方必須用「想像／就像／有些人」框起、不具名、不當成真實事件；不得自編對話，只有來源明載的引述可以直接引用。頁數上限 10，符合 Instagram 輪播與 Discord 審核的附件上限。"
          - "每頁必須使用精確繁中正文，不能依賴圖片模型產字。"
      native_h3_t2v_story:
        summary: "純文字驅動的 15 秒單一連續影片；沒有輸入圖、沒有指定首幀、沒有指定尾幀，也沒有 reference manifest。"
        best_for:
          - "需求重點是探索新的場景、動作、鏡頭或敘事點子，且可接受模型自行決定第一畫面與最後畫面。"
          - "使用者明確說不需要參考圖、首幀、尾幀、角色設計稿或既有素材。"
          - "需要快速驗證一個單一短故事概念，而不是精準重現既有構圖。"
        avoid_when:
          - "角色外觀、服裝、道具、場景或開場構圖必須精準延續既有圖片；這時應用 First Frame 或 Reference-to-Video。"
          - "結尾畫面、角色最終位置、場景轉變或 before/after 結果必須命中；這時應用 First+Last Frame。"
        hard_rules:
          - "不得把它當成 Reference-to-Video、First Frame 或 Last Frame 模式；此模式沒有任何畫面控制輸入。"
      native_h3_story:
        summary: "角色故事導向的 First Frame I2VA 預設模式：先建立並審核開場關鍵畫面，再讓 H3 自行完成後續動作與結尾。"
        best_for:
          - "要做 15 秒左右、單一連續鏡頭感的 Kirby 故事，並希望開頭身份、服裝與構圖先被鎖定。"
          - "需求包含明確衝突、行動與結果，但沒有要求一個必須命中的最後畫面。"
          - "需要先審核角色關鍵畫面，再執行影片生成。"
        avoid_when:
          - "只需要快速自由發想、完全不關心開頭畫面；改用 native_h3_t2v_story。"
          - "同時要求固定開頭與固定結尾；改用 native_h3_fl2va_story。"
          - "只要求固定最後 reveal；改用 native_h3_l2va_story。"
          - "有多張既有角色圖、風格圖或參考影片必須一起遵守；改用 native_h3_ref2va。"
        hard_rules:
          - "此模式只鎖定 first frame；不得宣稱會鎖定 last frame，也不得當成 First+Last Frame 或 Reference-to-Video。"
          - "使用者未提供外部開場圖時，由此模式的 keyframe stage 先產生並審核開場圖；不要把『沒有外部首圖』誤判成模式不可用。"
      native_h3_fl2va_story:
        summary: "First+Last Frame to Video：同時鎖定第一幀與最後一幀，讓模型生成從 A 狀態明確過渡到 B 狀態的一條連續影片。"
        best_for:
          - "使用者明確描述開頭與結尾，例如『Kirby 在雨中抱著破傘，最後站在晴天的花田』。"
          - "影片的價值在可驗證的轉變：變身、修復、抵達目的地、道具由破損變完整、場景由危機變結果。"
          - "結尾姿勢、地點、關鍵道具、情緒或視覺 payoff 必須被控制與審核。"
        avoid_when:
          - "只有一個起始畫面或角色身份需要鎖定，但結局不重要；改用 First Frame I2V / text2image2video。"
          - "沒有具體可視化的終點畫面，或只說『做一支有趣影片』；不要浪費控制能力，改用 T2V 或 First Frame I2V。"
        hard_rules:
          - "此模式必須有兩個可描述、可審核且不同的視覺狀態：opening state 與 landing state。"
          - "不得僅因為需求提到影片就選此模式；沒有明確終點時禁止選擇。"
      native_h3_loop_story:
        summary: "無縫循環：一張審核通過的關鍵畫面同時當第一幀與最後一幀，約 10 秒的單一鏡頭小笑點，最後一個動作把角色與所有道具帶回開場配置，重播時沒有接縫；不使用新聞，只靠一個道具與誇張的全身反應。"
        best_for:
          - "角色想要某樣東西、道具或場景使壞、角色大幅變形反應的輕鬆短笑點，看第二、第三遍仍然好笑。"
          - "不依賴新聞或劇情因果，重點是可重複觀看的節奏與表情。"
        avoid_when:
          - "需要從 A 狀態到 B 狀態的可驗證轉變；改用 native_h3_fl2va_story。"
          - "需要新聞事實或有因果的故事；改用 native_h3_story。"
        hard_rules:
          - "首尾使用同一張審核通過的畫面，不產生第二張結尾圖，也不經過 FLUX 精修。"
          - "最後一個動作必須把角色與所有道具帶回開場配置，且最後一幀仍在動；不可停在定格收尾姿勢。"
          - "整段為單一連續鏡頭，不可出現切鏡；只有一個道具作為笑點引擎。"
      native_h3_l2va_story:
        summary: "Last Frame to Video：以最後一幀作為不可妥協的落點，允許模型自由設計前段行動與開場，最後收束到指定畫面。"
        best_for:
          - "使用者最在意影片最後的 reveal、勝利姿勢、最終場景、封面級收尾或發文縮圖畫面。"
          - "前段可以保有探索與驚喜，但最終必須抵達一個指定的可視化結果。"
          - "需求只明確描述『最後要看到什麼』，沒有要求固定起始構圖。"
        avoid_when:
          - "第一幀角色外觀或構圖也必須鎖定；改用 First+Last Frame。"
          - "沒有清楚的結尾畫面，或重點是延續既有首圖；改用 T2V、First Frame I2V 或 FL2VA。"
        hard_rules:
          - "必須能寫出明確的 landing frame；若無法描述最後一幀的主體、動作、場景與結果，禁止選擇。"
      native_h3_ref2va:
        summary: "Reference-to-Video：有效 reference manifest 會直接作為多參考條件；若 manifest 為空，runtime 會先產生六張 T2I candidates，交由 Discord 選擇後再送入 Ref2VA。"
        best_for:
          - "有多張 Kirby 角色設計稿、既有成品圖、風格板、場景圖，或參考影片，而且這些素材都必須影響成品。"
          - "角色身份、配色、特定服裝、道具或畫風的一致性比自由探索更重要。"
          - "需求明確要求『依照這些參考圖／影片』、『保持這套設計』或『沿用這個鏡頭語言』。"
        avoid_when:
          - "想要明確看見並命名自動候選圖 stage；此時可直接選 text2image2native_h3_ref2va。"
          - "只有一張起始圖片且不需要多素材約束；First Frame I2V 較簡單、成本與失敗面更低。"
        hard_rules:
          - "若已配置 reference manifest，所有項目都必須可讀、有效且與需求相關；空 manifest 只能進入六張候選圖加 Discord 選擇 gate。"
          - "配置了缺檔或不可讀 references 時，仍然禁止選擇 native_h3_ref2va；不可把錯誤 manifest 當成空 manifest。"
          - "不可把未經使用者選擇的模型生成泛用首圖誤稱為多參考控制；空 manifest 必須等 Discord 選定 references 後才可送入 Ref2VA。"
      text2image2native_h3_ref2va:
        summary: "Auto T2I-to-Ref2VA：先由 native story prompt 產生六張 reference candidates，交由使用者在 Discord 選擇 1-4 張，再把選定素材送入 native H3 Ref2VA。"
        best_for:
          - "使用者需要多參考控制，但目前沒有可直接使用的 reference manifest。"
          - "希望先比較角色、服裝、道具、場景或構圖候選，再由選定素材驅動影片。"
          - "需要保留明確的 user selection gate，不能讓模型自行把任意首圖當成 reference。"
        avoid_when:
          - "已有可讀取且已確認的 reference manifest；此時直接使用 native_h3_ref2va，避免重複產圖。"
          - "只需要一張首幀再做普通 I2V；此時 text2image2video 或 native_h3_story 較簡單。"
        hard_rules:
          - "T2I candidate 與 native Ref2VA 是兩個明確 stage；candidate 不得未經選擇直接偷偷成為 reference。"
          - "正常流程必須讓使用者在 Discord 選擇 1-4 張；Reject 必須停止流程，不得自動補選。"
          - "使用者選定後 reference asset 不可被後續 hidden refine 或 regenerate 替換。"
      text2img:
        summary: "用於單張或少量高品質靜態圖，適合角色立繪、封面圖、主視覺、海報感插圖與定裝圖。"
        best_for:
          - "需求重點是角色外觀、服裝、表情、姿勢、構圖與畫面精緻度，不要求影片。"
          - "需要先產多張候選圖，再人工挑選最好的一張。"
          - "要做 sticker 母圖、影片首幀或後續動畫的 key visual。"
        avoid_when:
          - "使用者明確要影片、鏡頭運動、長故事或聲音。"
          - "需求明確是保留既有圖片後微調，這時比較像 text2image2image。"
      text2video:
        summary: "純 prompt 驅動的單一短動態片段；video stage 使用 H3 T2V，不會把同路線產生的 image stage 當成影片首幀條件。"
        best_for:
          - "需求是短片、loop、角色小動作、簡單運鏡或單場景展示。"
          - "使用者要畫面動起來，但沒有明確多段故事結構。"
          - "可接受模型自行決定開場與結尾，不要求保留既有圖片構圖。"
        avoid_when:
          - "需求有明顯分鏡、章節、旁白或多段敘事，應改選 serial_video。"
          - "需要由指定首圖驅動 motion，應改選 text2image2video；不要把 text2video 的 optional image stage 誤當成 I2V。"
          - "使用者其實只想先確認靜態造型，應改選 text2img。"
        hard_rules:
          - "video_workflow_name 必須是 T2V workflow；image_workflow_name 若存在，只代表 ideation、cover 或 review artifact，不代表 video conditioning。"
      text2image2video:
        summary: "先產首圖再轉影片，適合先鎖定角色外觀與構圖，再延伸成短片。"
        best_for:
          - "角色長相、配色、服裝需要先被固定，再加 motion。"
          - "需求像是把插畫動起來、把海報做成短動畫、由 key visual 延伸短片。"
          - "想兼顧首幀質感與後續動態穩定度。"
        avoid_when:
          - "只要純靜態圖。"
          - "需要長篇故事、多段轉場與段落銜接，應改選 serial_video。"
      text2image2image:
        summary: "先出圖再做 img2img refine，適合保留原構圖與角色辨識度，同時重繪細節、換風格或修正局部。"
        best_for:
          - "需求像是同一張圖再修一下、保留構圖但更精緻、換風格但不要整張重來。"
          - "首輪生成不錯，但臉、手、服裝、背景一致性需要修。"
          - "需要 transition frame、風格統一或角色定稿後微調。"
        avoid_when:
          - "需求本質是影片。"
          - "使用者想要大量不同構圖候選圖，直接 text2img 更適合。"
      sticker_pack:
        summary: "專門給多表情聊天貼圖使用，重點是角色一致性、情緒區隔清楚、可批量產出。"
        best_for:
          - "需求出現 sticker、reaction、line sticker、emoji pack、表情包。"
          - "同一角色要做多個情緒版本，例如開心、生氣、無奈、驚訝、哭泣。"
          - "需要透過 sticker_expression_count 與 images_per_prompt 批次出圖。"
        avoid_when:
          - "目標是單張高完成度插圖或完整故事影片。"
    selection_rules:
      - "若使用者明確要求多頁故事字卡、心靈雞湯式感性文字或 writing-first carousel，優先選 story_card。"
      - "先判斷控制素材：有多張或多種既有參考素材且必須保留身份／風格／鏡頭語言時，reference manifest 非空且可讀取才選 native_h3_ref2va。"
      - "若需要多參考控制但沒有既有 reference manifest，canonical 命名是 text2image2native_h3_ref2va，先產生六張候選圖，再經 Discord 選擇後送入 Ref2VA；直接選 native_h3_ref2va 也會走同一個空 manifest 自動 gate。"
      - "再判斷結尾控制：需求同時明確描述可驗證的第一畫面與最後畫面，或必須完成 A 到 B 的視覺狀態轉換時，選 native_h3_fl2va_story。"
      - "若只明確要求最後的 reveal、抵達、勝利姿勢或發文縮圖結果，而開頭可自由創作，選 native_h3_l2va_story。"
      - "若只需鎖定角色第一畫面、身份或構圖，結尾可自由發展，選 text2image2video 的 First Frame I2V，不要選 FL2VA 或 L2VA。"
      - "若沒有可用參考素材、沒有指定首幀或尾幀，且目標是自由探索的一支單一短片，選 native_h3_t2v_story。"
      - "若要一支有明確因果故事、需要先審核開場關鍵畫面，但結尾可由模型自然發展，選 native_h3_story（First Frame I2VA）。"
      - "native_h3_ref2va 的空 manifest 必須進入六張候選圖加 Discord 選擇 gate，不得繞過選擇直接送入；缺檔或不可讀的已配置 references 仍然禁止。"
      - "禁止選 native_h3_fl2va_story：無法描述不同的 opening state 與 landing state 時。"
      - "禁止選 native_h3_l2va_story：無法描述具體 landing frame 時。"
      - "若使用者明確要求 sticker、line 貼圖、reaction pack、聊天表情包，優先選 sticker_pack。"
      - "若需求包含連續故事、旁白、章節、分鏡、episode、multi-scene，優先選 serial_video。"
      - "若需求是短影片，但角色外觀必須先鎖定，優先選 text2image2video。"
      - "若需求是 5-9 秒、單一可愛 physical gag、食物／桌面互動、誇張伸縮、反應 loop 或小角色對大物件的比例笑點，優先選 text2image2video；先審核一張首幀，再用 I2V 完成一個可回看的動作。"
      - "短 gag 只需要一個主道具、一個主動作、一個反應和一個 settled payoff；不要為了填滿時長改走 serial_video 或堆疊多個劇情裝置。"
      - "若需求只有單鏡頭動態或展示型 motion，沒有長篇敘事，優先選 text2video。"
      - "若使用者描述保留原圖、原構圖、原角色，只做修圖或風格微調，優先選 text2image2image。"
      - "若需求重點是單張高品質畫面、角色立繪、封面、海報、概念圖，優先選 text2img。"

  routing_hints:
    runtime_context_schema:
      reference_manifest_available: "Runtime boolean. True only when at least one configured image/video reference exists and every configured file is readable."
      reference_image_count: "Runtime count of validated reference images; paths are intentionally not sent to the LLM."
      reference_video_count: "Runtime count of validated reference videos; paths are intentionally not sent to the LLM."
      automatic_ref2va_eligible: "Runtime boolean. True when configured references are valid or when the automatic route can create six T2I candidates for Discord reference selection."
      reference_manifest_error_code: "Runtime status: auto_generation_available, missing_file, invalid, or empty string when validated."
      routing_policy: "native_h3_ref2va uses existing references when available; with an empty manifest it expands into the same six-candidate Discord review contract as text2image2native_h3_ref2va."
    workflow_stage_contracts:
      text2img:
        image_workflow_name: "Required static-image stage. It may produce one image or the configured candidate count; no video stage is implied."
      text2video:
        image_workflow_name: "Optional ideation/cover artifact only; it is not connected as video conditioning."
        video_workflow_name: "Required T2V stage. Select only a workflow whose graph has no first_frame or last_frame input."
      text2image2video:
        image_workflow_name: "Required first-stage image. Its selected output becomes the first-frame input to the I2V stage."
        video_workflow_name: "Required I2V stage. It must accept first_frame conditioning."
      text2image2image:
        image_workflow_name: "Required source-image stage for the refine chain."
        refine_workflow_name: "Required img2img refine stage. It must preserve the selected source image contract while applying the requested changes."
      text2longvideo:
        image_workflow_name: "Opening identity/reference stage and deliberate FL2V landing-frame stage."
        video_workflow_name: "Required multi-segment H3 I2V stage; every segment after the opening consumes the previous segment's rendered tail."
        transition_workflow_name: "Optional FL2V stage reserved for deliberate state transitions; its first frame still comes from the previous rendered tail."
      native_h3_story:
        image_workflow_name: "Opening keyframe candidate; review selects one first frame."
        video_workflow_name: "Native H3 I2VA stage. It receives first_frame and leaves the ending unconstrained."
        refine_workflow_name: "Optional identity/continuity img2img before the opening frame is submitted."
      native_h3_t2v_story:
        video_workflow_name: "Required Native H3 T2V stage. It is prompt-only and must not receive first_frame, last_frame, or reference-manifest conditioning."
      native_h3_fl2va_story:
        image_workflow_name: "Two keyframe candidates: opening first frame and landing last frame."
        video_workflow_name: "Native H3 FL2VA stage. It receives both first_frame and last_frame."
      native_h3_l2va_story:
        image_workflow_name: "Landing keyframe candidate only."
        video_workflow_name: "Native H3 L2VA stage. It receives last_frame and leaves the opening unconstrained."
      native_h3_ref2va:
        video_workflow_name: "Reference-to-video stage. Existing reference images/videos are used directly; with no manifest, runtime first creates six T2I candidates and injects only Discord-selected references. Reference audio is forbidden."
      text2image2native_h3_ref2va:
        image_workflow_name: "Required T2I reference-candidate stage. Generate six still candidates from the native story prompt; these are reviewable reference assets, not an implicit first frame."
        video_workflow_name: "Required native H3 Ref2VA stage. It receives only the references explicitly selected by the user in Discord; reference audio is forbidden."
      sticker_pack:
        image_workflow_name: "Required batch image stage. Generate the configured expression candidates with transparent-background and sticker-safe composition rules. The sticker_pack planner ends after packaging; any optional video candidate belongs to the separate explicit animated_sticker route."

version: 1
snapshot_date: '2026-09-26'
discover_catalog_at_runtime: false
randomize_each_request: true

# This pool mirrors AGENTIC_OPENROUTER_TEXT_MODELS and
# AGENTIC_OPENROUTER_VISION_MODELS in media_overload.env and
# media_overload.env.example. Model availability is checked against the live
# OpenRouter catalog; new candidates still need project-specific JSON review.
# mode=structured sends response_format for ordinary JSON requests;
# prompt_only relies on the prompt plus the shared fence/fragment JSON parser;
# reasoning_off disables hidden reasoning where it otherwise consumes the answer
# budget. Native H3 story generation explicitly uses prompt-only JSON.
text:
  - id: nvidia/nemotron-3-ultra-550b-a55b:free
    mode: structured
  - id: nvidia/nemotron-3-super-120b-a12b:free
    mode: structured
  - id: nvidia/nemotron-3.5-lightning:free
    mode: prompt_only
  - id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    mode: reasoning_off
  - id: qwen/qwen3.8-27b:free
    mode: structured

vision:
  - id: google/gemma-4-26b-a4b-it:free
    mode: structured
  - id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    mode: reasoning_off
  - id: qwen/qwen3.8-27b:free
    mode: structured

# The pool intentionally follows the active env file, including models that were
# previously excluded from an older smoke-test snapshot.

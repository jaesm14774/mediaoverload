version: 1
snapshot_date: '2026-08-22'
discover_catalog_at_runtime: false
randomize_each_request: true

# This pool mirrors AGENTIC_OPENROUTER_TEXT_MODELS and
# AGENTIC_OPENROUTER_VISION_MODELS in media_overload.env.
# mode=structured sends response_format; prompt_only relies on the strict prompt
# plus the shared fence/fragment JSON parser; reasoning_off disables hidden
# reasoning where it otherwise consumes the answer budget.
text:
  - id: nvidia/nemotron-3-ultra-550b-a55b:free
    mode: structured
  - id: nvidia/nemotron-3-super-120b-a12b:free
    mode: structured
  - id: nvidia/nemotron-3.5-lightning:free
    mode: structured
  - id: google/gemma-4-31b-it:free
    mode: structured
  - id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    mode: reasoning_off
  - id: z-ai/glm-5.2:free
    mode: structured

vision:
  - id: google/gemma-4-26b-a4b-it:free
    mode: structured
  - id: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    mode: reasoning_off
  - id: nvidia/nemotron-nano-12b-v2-vl:free
    mode: prompt_only
  - id: google/gemma-4-31b-it:free
    mode: structured

# The pool intentionally follows the active env file, including models that were
# previously excluded from an older smoke-test snapshot.

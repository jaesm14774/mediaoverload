# Styles Krea 2 draws from; definitions live in catalog.json. To add a model, add
# <model>.yaml next to this file listing the styles it is good at under `enabled`,
# then name it in the character's generation.creative_profile.style.model.
# `enabled` is the uniform random pool for images, videos and serial series (edited
# by the style picker). A serial series draws once and keeps its style afterwards.
enabled:
- storybook_watercolor
- soft_pastel_characters
- bold_cartoon_comic
- cinematic_painterly
- ink_wash_frame
- tarot_gold_frame
- cozy_game_diorama
- photographic_character_fusion
- crayon_storybook
- marker_pastel
- cut_paper_collage
- ghibli-style
- children-s-book-drawing
- vintage-children-s-book-drawing
- collector-storybook-illustration
- whimsical-illustration
- watercolor-painting
- wet-on-wet-watercolor-ink-painting
- watercolor-anime-illustration
- playful-hand-drawn-illustration
- very-simplistic-doodle

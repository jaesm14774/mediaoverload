character:
  name: Kirby
  group_name: Kirby

generation:
  output_dir: D:/MediaOverload/output
  # Apply the speed transform after the final video is rendered and before
  # technical QA, Discord review, and social publishing.
  video_speed:
    enabled: true
    factor: 2.0
  h3_profile: balanced-lowvram
  # Use single, two_character_interaction, or random. random requires
  # subject_mode_weights with positive weights for the concrete modes.
  subject_mode: random
  # Change subject_mode to random to use these proportional weights.
  subject_mode_weights:
    single: 2
    two_character_interaction: 5
  two_character_interaction:
    is_same_group: true
  style_weights:
    polished 2D anime: 4
    cel-shaded animation: 2
    hand-painted storybook anime: 1
  keyframe_workflow_name: krea2_turbo
  identity_refine_workflow_name: krea2_turbo_img2img
  # Longvideo stories are generated from the current brief/news context. A
  # static meadow preset here silently replaced unrelated news prompts.
  storyboard_path: ""
  input_gate: kirby-pink-red-silhouette
  visual_style_contract: >-
    Tactile pastel 2D anime gag animation: keep one small Kirby readable inside
    one dominant news mechanism or oversized physical environment, with a clear
    focal silhouette, generous negative space, one dominant palette, and a close
    readable reaction.
    Use squash-and-stretch, wobble, recoil, or elastic snap only when caused by
    the visible action. Prefer a stable ending image that echoes the opening
    prop or pose so a short clip can replay cleanly after its payoff. Choose one
    visual language per clip: soft paper-grain storybook, clean cel-shaded
    sticker, warm tabletop food comedy, cozy container scale contrast, or a
    saturated sky/firework spectacle; do not stack them all together.
  native_h3_quality:
    semantic_qa_blocking: true
    creative_brief: >-
      Make this a highly shareable cute micro-gag, not an action-film lore scene:
      one Kirby, one dominant news mechanism, one readable setback, and one
      visible reversal/payoff. The first second must already contain motion and
      a clear expressive reaction. Prefer a close readable face or body
      reaction, exaggerated but charming timing, a small absurd surprise, a
      strong small-versus-large scale contrast, and a final visual joke that
      lands without dialogue. Translate every news item through three visible
      layers: source context, active mechanism, and physical consequence. A
      prop is optional; use architecture, environmental force, spatial
      relationship, synchronized change, or a prop only when it is the best
      expression of the news mechanism. Avoid defaulting to an orb, ball,
      balloon, wallet, ribbon, or seal when the source event does not require
      that shape. End with a concrete settled result that can echo the opening
      for a loop.
      Do not show
      Kirby fighting a duplicate, multiple characters, readable interfaces,
      GitHub/web text, abstract symbols, or Kirby standing still while looking
      at a portal.
  native_h3_story:
    storyboard_path: configs/storyboards/kirby_native_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_lowvram_15s_fl2va_i2v
    keyframe_workflow_name: krea2_turbo
    keyframe_candidate_count: 6
    require_human_review: true
    semantic_qa_required: true
    use_last_frame: false
    width: 608
    height: 352
    length: 362
    steps: 16
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_t2v_story:
    storyboard_path: configs/storyboards/kirby_native_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_lowvram_t2v
    semantic_qa_required: true
    semantic_qa_blocking: true
    width: 608
    height: 352
    length: 362
    steps: 16
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_fl2va_story:
    storyboard_path: configs/storyboards/kirby_native_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_lowvram_15s_fl2va_i2v
    keyframe_workflow_name: krea2_turbo
    keyframe_candidate_count: 1
    require_human_review: true
    semantic_qa_required: true
    use_last_frame: true
    width: 608
    height: 352
    length: 362
    steps: 16
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_l2va_story:
    storyboard_path: configs/storyboards/kirby_native_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_lowvram_15s_fl2va_i2v
    keyframe_workflow_name: krea2_turbo
    keyframe_candidate_count: 1
    require_human_review: true
    semantic_qa_required: true
    last_frame_only: true
    width: 608
    height: 352
    length: 362
    steps: 16
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_ref2va:
    storyboard_path: configs/storyboards/kirby_native_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_ref2va
    reference_manifest: []
    reference_image_size: match
    reference_candidate_count: 6
    reference_selection_limit: 4
    reference_max_images: 9
    reference_max_videos: 3
    model_profile: q4
    semantic_qa_required: true
    width: 608
    height: 352
    length: 362
    steps: 20
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  text2image2native_h3_ref2va:
    storyboard_path: configs/storyboards/kirby_native_15s.yaml
    duration_seconds: 15
    keyframe_workflow_name: krea2_turbo
    workflow_name: minimax_h3_ref2va
    reference_candidate_count: 6
    reference_selection_limit: 4
    reference_max_images: 9
    reference_max_videos: 3
    reference_image_size: match
    model_profile: q2
    require_human_review: true
    semantic_qa_required: true
    width: 608
    height: 352
    length: 362
    steps: 20
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  video_defaults:
    width: 608
    height: 352
    length: 124
    frame_rate: 24
    steps: 20
    draft_acceleration: spectrum
  generation_type_weights:
    text2img: 1
    text2image2video: 1
    text2longvideo: 2
    native_h3_story: 1
    native_h3_t2v_story: 1
    native_h3_fl2va_story: 1
    native_h3_l2va_story: 1
    native_h3_ref2va: 1
    text2image2native_h3_ref2va: 1
    sticker_pack: 2

social_media:

character:
  # This config is the concrete Kirby pack, not the whole Kirby-universe pool.
  # Keeping the role fixed prevents a Krea2 image request from silently
  # selecting Magolor, MetaKnight, or another group member.
  name: Kirby
  group_name: Kirby

generation:
  output_dir: output
  # Weighted selection enters the same serial workflow as the explicit CLI option.
  serial_video:
    enabled: true
    story_complexity: random
    story_complexity_weights:
      simple: 9
      cinematic: 1
    series_selection_weights:
      new: 0.5
      continue: 0.5
    default_duration_seconds: 30
    episodes_per_run: 1
    style: watercolor storybook animation
    output_dir: output
    discord_review_timeout_seconds: 1800
    identity_references: []
  # Use single, two_character_interaction, or random. random requires
  # subject_mode_weights with positive weights for the concrete modes.
  subject_mode: random
  # Change subject_mode to random to use these proportional weights.
  subject_mode_weights:
    single: 3
    two_character_interaction: 1
  two_character_interaction:
    is_same_group: false
  # One creative profile is selected per run. The canvas selection is shared
  # by every still and video node in that run; story cards keep their own
  # editorial 4:5 layout contract below.
  creative_profile:
    canvas:
      mode: fixed
      fixed: landscape_16_9
      random_weights:
        landscape_16_9: 3
        portrait_4_5: 2
        square_1_1: 2
      profiles:
        landscape_16_9:
          aspect_ratio: "16:9"
          width: 640
          height: 360
        portrait_4_5:
          aspect_ratio: "4:5"
          width: 512
          height: 640
        square_1_1:
          aspect_ratio: "1:1"
          width: 512
          height: 512
    style:
      mode: random
      catalog: krea2
  keyframe_workflow_name: krea2_turbo
  identity_refine_workflow_name: flux3_image_klein_img2img
  motion_comic:
    duration_seconds: 10
    width: 576
    height: 1024
    fps: 24
    image_width: 1024
    image_height: 768
    steps: 8
  # Writing-first Traditional-Chinese story cards. Every page is generated
  # independently from one shared visual contract before Pillow places text.
  story_card:
    page_stage:
      workflow_name: krea2_turbo
    # Auto keeps a short thought on one card and splits anything over 40
    # characters into the smallest coherent set of pages.
    page_count: auto
    width: 540
    height: 675
    overlay_opacity: 176
    brand_label: CHARACTER NOTE
  # Longvideo stories are generated from the current brief/news context. A
  # static meadow preset here silently replaced unrelated news prompts.
  # Additive game asset route. It remains separate from the story, sticker,
  # and social-video recipes above while being available for explicit or
  # weighted-random selection.
  game_sprite:
    keyframe_workflow_name: krea2_turbo
    video_workflow_name: minimax_h3_i2va
    h3_model_profile: q4
    duration_seconds: 10
    source_width: 1024
    source_height: 576
    video_width: 608
    video_height: 352
    video_length: 240
    video_steps: 16
    fps: 12
    cell_width: 64
    cell_height: 64
  native_h3_story:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_i2va
    keyframe_workflow_name: krea2_turbo
    keyframe_candidate_count: 6
    require_human_review: true
    use_last_frame: false
    length: 362
    steps: 16
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_t2v_story:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_t2va
    length: 362
    steps: 16
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_fl2va_story:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_fl2va
    keyframe_workflow_name: krea2_turbo
    identity_refine_workflow_name: flux3_image_klein_img2img
    keyframe_candidate_count: 6
    require_human_review: true
    use_last_frame: true
    length: 362
    steps: 16
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_l2va_story:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_l2va
    keyframe_workflow_name: krea2_turbo
    identity_refine_workflow_name: flux3_image_klein_img2img
    keyframe_candidate_count: 1
    require_human_review: true
    last_frame_only: true
    length: 362
    steps: 16
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_ref2va:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_ref2va
    reference_manifest: []
    reference_image_size: match
    reference_candidate_count: 6
    reference_selection_limit: 4
    reference_max_images: 9
    reference_max_videos: 3
    model_profile: q4
    length: 362
    steps: 20
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  text2image2native_h3_ref2va:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    keyframe_workflow_name: krea2_turbo
    workflow_name: minimax_h3_ref2va
    reference_candidate_count: 6
    reference_selection_limit: 4
    reference_max_images: 9
    reference_max_videos: 3
    reference_image_size: match
    model_profile: q4
    require_human_review: true
    length: 362
    steps: 20
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  video_defaults:
    length: 240
    frame_rate: 24
    steps: 20
    # Keep image-to-video renders within this workflow's frame limit.
    max_i2v_frames: 240
  generation_type_weights:
    serial_video: 40
    text2img: 1
    text2image2video: 1
    native_h3_story: 1
    native_h3_t2v_story: 1
    native_h3_fl2va_story: 1
    native_h3_l2va_story: 1
    native_h3_ref2va: 1
    text2image2native_h3_ref2va: 1
    sticker_pack: 3
    story_card: 2
    motion_comic: 2
    game_sprite: 3

social_media:
  # Hashtags are generated from the final article and visible media.
  # Do not hard-code internal project names here.
  default_hashtags: []

  platforms:
    instagram_graph:
      config_folder_path: /app/configs/social_media/credentials/kirby
      prefix: ""
      enabled: true

    facebook:
      config_folder_path: /app/configs/social_media/credentials/kirby
      prefix: ""
      enabled: true

    threads:
      config_folder_path: /app/configs/social_media/credentials/kirby
      prefix: ""
      enabled: true

    youtube:
      config_folder_path: /app/configs/social_media/credentials/kirby
      prefix: ""
      enabled: true

    twitter:
      config_folder_path: /app/configs/social_media/credentials/kirby
      prefix: ""
      # X API is pay-per-use now; keep it out of free scheduled runs.
      enabled: false

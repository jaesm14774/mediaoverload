character:
  # This config is the concrete Kirby pack, not the whole Kirby-universe pool.
  # Keeping the role fixed prevents a Krea2 image request from silently
  # selecting Magolor, MetaKnight, or another group member.
  name: Kirby
  group_name: Kirby

generation:
  output_dir: output
  # Weighted selection enters the same serial workflow as the explicit CLI option.
  serial_video:
    enabled: true
    story_complexity: random
    story_complexity_weights:
      simple: 7
      cinematic: 3
    series_selection_weights:
      new: 0.5
      continue: 0.5
    # A continuing drama: about one minute per episode, one series question that
    # outlives every episode. 4 clips of up to 15 s keep the chained hand-offs few.
    default_duration_seconds: 60
    episodes_per_run: 1
    # Each series draws one of these illustration styles (seeded by its series id)
    # and keeps it, with its canvas, for every reference image and episode.
    style_ids:
      - storybook_watercolor
      - soft_pastel_characters
      - bold_cartoon_comic
      - ghibli-style
      - children-s-book-drawing
      - collector-storybook-illustration
      - whimsical-illustration
      - watercolor-painting
      - watercolor-anime-illustration
      - playful-hand-drawn-illustration
    output_dir: output
    discord_review_timeout_seconds: 1800
    identity_references: []
  # Use single, two_character_interaction, or random. random requires
  # subject_mode_weights with positive weights for the concrete modes.
  subject_mode: random
  # Change subject_mode to random to use these proportional weights.
  subject_mode_weights:
    single: 3
    two_character_interaction: 1
  two_character_interaction:
    is_same_group: false
  # Select one weighted canvas per run and share it across generated images
  # and videos, including serial-video. Story cards keep their own canvas.
  creative_profile:
    canvas:
      mode: random
      random_weights:
        landscape_16_9: 2
        portrait_4_5: 3
        square_1_1: 1
      profiles:
        landscape_16_9:
          aspect_ratio: "16:9"
          width: 640
          height: 360
        portrait_4_5:
          aspect_ratio: "4:5"
          width: 512
          height: 640
        square_1_1:
          aspect_ratio: "1:1"
          width: 512
          height: 512
    style:
      mode: random
      catalog: krea2
  keyframe_workflow_name: krea2_turbo
  identity_refine_workflow_name: flux3_image_klein_img2img
  # Keeps its own portrait page (576x1024) and ignores the selected run
  # canvas; the compositor only accepts portrait pages.
  motion_comic:
    duration_seconds: 10
    fps: 24
    steps: 8
  # Writing-first Traditional-Chinese story cards. A text card is read, so it
  # keeps its own 4:5 portrait canvas instead of the run's random landscape or
  # square one, which leaves room for only a caption.
  story_card:
    canvas:
      width: 864
      height: 1080
    page_stage:
      workflow_name: krea2_turbo
    # Auto sizes the set by source evidence: headline 1-3 pages, summary 3-5,
    # article excerpt 4-7 pages of 50-120 characters each.
    page_count: auto
    brand_label: CHARACTER NOTE
  # Longvideo stories are generated from the current brief/news context. A
  # static meadow preset here silently replaced unrelated news prompts.
  # Additive game asset route. It remains separate from the story, sticker,
  # and social-video recipes above while being available for explicit or
  # weighted-random selection.
  game_sprite:
    keyframe_workflow_name: krea2_turbo
    video_workflow_name: minimax_h3_i2va
    # The atlas keeps 16 frames at 128x128, so the clip only needs a short run
    # on a small canvas. H3 rounds 5 seconds up to 124 frames.
    duration_seconds: 7
    video_max_edge: 384
    fps: 12
    cell_width: 128
    cell_height: 128
  native_h3_story:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_i2va
    keyframe_workflow_name: krea2_turbo
    keyframe_candidate_count: 6
    require_human_review: true
    use_last_frame: false
    length: 362
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_t2v_story:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_t2va
    length: 362
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_fl2va_story:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_fl2va
    keyframe_workflow_name: krea2_turbo
    identity_refine_workflow_name: flux3_image_klein_img2img
    keyframe_candidate_count: 6
    require_human_review: true
    use_last_frame: true
    length: 362
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  # Seamless gag loop: one reviewed keyframe is both the first and last frame
  # of a ~10 s FL2VA clip (243 frames = 5 + 17 * 14, the first valid length
  # above the 10 s floor), so no ending frame or refine step is needed.
  native_h3_loop_story:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 10
    workflow_name: minimax_h3_fl2va
    keyframe_workflow_name: krea2_turbo
    keyframe_candidate_count: 6
    require_human_review: true
    length: 243
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_l2va_story:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_l2va
    keyframe_workflow_name: krea2_turbo
    identity_refine_workflow_name: flux3_image_klein_img2img
    keyframe_candidate_count: 1
    require_human_review: true
    last_frame_only: true
    length: 362
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  native_h3_ref2va:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    workflow_name: minimax_h3_ref2va
    reference_manifest: []
    reference_image_size: match
    reference_candidate_count: 6
    reference_selection_limit: 4
    reference_max_images: 9
    reference_max_videos: 3
    model_profile: q4
    length: 362
    steps: 20
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  text2image2native_h3_ref2va:
    storyboard_path: configs/storyboards/native_h3_15s.yaml
    duration_seconds: 15
    keyframe_workflow_name: krea2_turbo
    workflow_name: minimax_h3_ref2va
    reference_candidate_count: 6
    reference_selection_limit: 4
    reference_max_images: 9
    reference_max_videos: 3
    reference_image_size: match
    model_profile: q4
    require_human_review: true
    length: 362
    steps: 20
    frame_rate: 24
    require_audio: true
    require_stereo_audio: true
    analyze_audio: true
  video_defaults:
    length: 240
    frame_rate: 24
    steps: 20
    # Keep image-to-video renders within this workflow's frame limit.
    max_i2v_frames: 240
  # Random pool. Check how often people accept each route with
  # `python scripts/strategy_acceptance.py`.
  generation_type_weights:
    serial_video: 3
    text2img: 3
    text2image2video: 0.1
    native_h3_story: 0.1
    # native_h3_t2v_story: 0.1
    # native_h3_fl2va_story: 0.1
    native_h3_loop_story: 1.5
    # native_h3_l2va_story: 0.1
    # native_h3_ref2va: 0.1
    # text2image2native_h3_ref2va: 0.1
    sticker_pack: 0.5
    story_card: 1
    motion_comic: 0.8
    series_carousel: 0.5
    game_sprite: 0.5

social_media:
  # Hashtags are generated from the final article and visible media.
  # Do not hard-code internal project names here.
  default_hashtags: []

  platforms:
    instagram_graph:
      config_folder_path: /app/configs/social_media/credentials/kirby
      prefix: ""
      enabled: true

    facebook:
      config_folder_path: /app/configs/social_media/credentials/kirby
      prefix: ""
      enabled: true

    threads:
      config_folder_path: /app/configs/social_media/credentials/kirby
      prefix: ""
      enabled: true

    youtube:
      config_folder_path: /app/configs/social_media/credentials/kirby
      prefix: ""
      enabled: true

    twitter:
      config_folder_path: /app/configs/social_media/credentials/kirby
      prefix: ""
      # X API is pay-per-use now; keep it out of free scheduled runs.
      enabled: false

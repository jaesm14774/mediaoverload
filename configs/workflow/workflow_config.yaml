# Workflow 配置映射文件
# 將 workflow 路徑映射到對應的配置（seed 排除、node 別名等）
# 路徑匹配支援：完整路徑、相對路徑後綴、純文件名
#
# node_aliases: 將邏輯名稱映射到實際 node_id，避免策略代碼中硬編碼
#   - load_image: LoadImage 節點
#   - positive_prompt: 正面提示詞節點
#   - audio_prompt: 音訊提示詞節點

workflows:
  # Krea2 uses the local GGUF profile selected for the RTX 4060 8GB machine.
  # The registry reports these as missing until they are manually installed;
  # the manifest does not auto-download them.
  "krea2_turbo.json":
    summary: "Krea 2 Turbo Q4_0 GGUF local T2I profile"
    required_assets:
      - name: "krea2_turbo_bf16-Q4_0.gguf"
        kind: "diffusion_model"
        target_dir: "ComfyUI/models/unet"
        source: "https://huggingface.co/molbal/krea2-gguf/resolve/main/krea2_turbo_bf16-Q4_0.gguf"
        expected_size: 8314016800
        sha256: "3d28960e1f3385b27a224c6968a0acc02b07194758247e576ee0c5caaab4f1cf"
      - name: "Qwen3VL-4B-Instruct-Q4_K_M.gguf"
        kind: "text_encoder"
        target_dir: "ComfyUI/models/clip"
        source: "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3VL-4B-Instruct-Q4_K_M.gguf"
        expected_size: 2497281664
        sha256: "66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a"
      - name: "qwen_image_vae.safetensors"
        kind: "vae"
        target_dir: "ComfyUI/models/vae"
        source: "https://huggingface.co/Comfy-Org/Krea-2/resolve/main/vae/qwen_image_vae.safetensors"
        expected_size: 253806246
        sha256: "a70580f0213e67967ee9c95f05bb400e8fb08307e017a924bf3441223e023d1f"
  "krea2_turbo_img2img.json":
    summary: "Krea 2 Turbo Q4_0 GGUF local img2img continuity profile"
    required_assets:
      - name: "krea2_turbo_bf16-Q4_0.gguf"
        kind: "diffusion_model"
        target_dir: "ComfyUI/models/unet"
        source: "https://huggingface.co/molbal/krea2-gguf/resolve/main/krea2_turbo_bf16-Q4_0.gguf"
        expected_size: 8314016800
        sha256: "3d28960e1f3385b27a224c6968a0acc02b07194758247e576ee0c5caaab4f1cf"
      - name: "Qwen3VL-4B-Instruct-Q4_K_M.gguf"
        kind: "text_encoder"
        target_dir: "ComfyUI/models/clip"
        source: "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3VL-4B-Instruct-Q4_K_M.gguf"
        expected_size: 2497281664
        sha256: "66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a"
      - name: "qwen_image_vae.safetensors"
        kind: "vae"
        target_dir: "ComfyUI/models/vae"
        source: "https://huggingface.co/Comfy-Org/Krea-2/resolve/main/vae/qwen_image_vae.safetensors"
        expected_size: 253806246
        sha256: "a70580f0213e67967ee9c95f05bb400e8fb08307e017a924bf3441223e023d1f"

  # Z-Image + Nova hybrid workflow. This is retained as a hybrid candidate;
  # only the pure Z-Image workflows are retired.
  "z_image_plus_nova_model.json":
    exclude_sampler_node_ids: ["80:44"]

  # Nova + Z-Image Anime hybrid workflow retained for explicit candidate use.
  "nova_model_plus_z_image_anime.json":
    exclude_sampler_node_ids: ["80:85"]

  # Tile Upscaler SDXL - 圖片放大 workflow
  "Tile Upscaler SDXL.json":
    node_aliases:
      load_image: "225"

  "minimax_h3_lowvram_i2v.json":
    conditioning:
      provider: "minimax_h3"
      recipes:
        anchor_first:
          anchors: [first]
          continuation: "none"
          render_tool: "comfy.workflow.image_to_video"

  "minimax_h3_lowvram_t2v.json":
    conditioning:
      provider: "minimax_h3"
      recipes:
        t2v:
          continuation: "none"
          render_tool: "comfy.workflow.text_to_video"

  "minimax_h3_native_t2v.json":
    conditioning:
      provider: "minimax_h3"
      recipes:
        t2v:
          continuation: "none"
          render_tool: "comfy.workflow.text_to_video"

  "minimax_h3_lowvram_15s_fl2va_i2v.json":
    conditioning:
      provider: "minimax_h3"
      recipes:
        anchor_first_last:
          anchors: [first, last]
          continuation: "planned_anchor"
          render_tool: "comfy.workflow.image_to_video"
        anchor_last:
          anchors: [last]
          continuation: "none"
          render_tool: "comfy.workflow.image_to_video"

  "minimax_h3_ref2va.json":
    conditioning:
      provider: "minimax_h3"
      recipes:
        reference_bundle:
          references: [image, video]
          reference_minimum: 1
          reference_maximum: 4
          reference_selection_limit: 4
          continuation: "none"
          render_tool: "comfy.workflow.reference_to_video"

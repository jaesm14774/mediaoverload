# Workflow 配置映射文件
# 將 workflow 路徑映射到對應的配置（seed 排除、node 別名等）
# 路徑匹配支援：完整路徑、相對路徑後綴、純文件名
#
# node_aliases: 將邏輯名稱映射到實際 node_id，避免策略代碼中硬編碼
#   - load_image: LoadImage 節點
#   - positive_prompt: 正面提示詞節點
#   - audio_prompt: 音訊提示詞節點

workflows:
  # z_image_plus_nova_model.json
  "z_image_plus_nova_model.json":
    exclude_sampler_node_ids: ["80:44"]

  # nova_model_plus_z_image_anime.json（kirby 等使用）
  # 若 nova 與 z-image 的 KSampler node_id 與非 anime 版不同，請更新以下值
  "nova_model_plus_z_image_anime.json":
    exclude_sampler_node_ids: ["80:85"]

  # Tile Upscaler SDXL - 圖片放大 workflow
  "Tile Upscaler SDXL.json":
    node_aliases:
      load_image: "225"

  "minimax_h3_lowvram_i2v.json":
    conditioning:
      provider: "minimax_h3"
      recipes:
        anchor_first:
          anchors: [first]
          continuation: "previous_tail_as_first"
          render_tool: "comfy.workflow.image_to_video"

  "minimax_h3_lowvram_15s_fl2va_i2v.json":
    conditioning:
      provider: "minimax_h3"
      recipes:
        anchor_first_last:
          anchors: [first, last]
          continuation: "previous_tail_as_first"
          render_tool: "comfy.workflow.image_to_video"
        anchor_last:
          anchors: [last]
          continuation: "none"
          render_tool: "comfy.workflow.image_to_video"

  "minimax_h3_ref2va.json":
    conditioning:
      provider: "minimax_h3"
      recipes:
        reference_bundle:
          references: [image, video]
          reference_minimum: 1
          reference_maximum: 4
          reference_selection_limit: 4
          continuation: "none"
          render_tool: "comfy.workflow.reference_to_video"
